name: Verify Signal Patch

on:
  workflow_dispatch:
    inputs:
      patch_code:
        description: Proposed function body
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply proposed patch to the isolated candidate
        env:
          PATCH_CODE: ${{ inputs.patch_code }}
        run: |
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; const declaration = 'declare const Order: { findById: (id: string) => Promise<{ status: string; depositAmount: number; save: () => Promise<void> } | null>; };\n\n'; writeFileSync('verification/candidate.ts', declaration + process.env.PATCH_CODE + '\n\nexport { confirmOrder };\n');"
      - run: npm run verify:patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-report
          path: verification/patch-report.json
          if-no-files-found: error
