name: Verify patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, typecheck and UI build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed patch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify patch
        id: verify
        run: npm run verify:patch

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          node -e "const r=require('./patch-report.json'); console.log('### Patch verification'); console.log('Status: **'+r.status+'**'); for (const c of r.checks) console.log('- '+(c.passed?'✅':'❌')+' `'+c.command+'` ('+c.durationMs+' ms)');" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-verification-report
          path: |
            patch-report.json
            .artifacts/vitest.json
          if-no-files-found: error